[package]
name = "graph-explorer-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.1" }

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
dirs = "6.0.0"
rand = { version = "0.9.2", features = ["os_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.1.1", features = ["image-png"] }
tiny_http = "0.12.0"
# Same crate (and version) `gx` encodes query parameters with, so the decode
# here is the exact inverse of the encode there.
urlencoding = "2.1.3"

# macOS only: set the Dock icon at runtime. This binary is unbundled (no
# .app/.icns) so the Dock would otherwise show the generic icon. AppKit and
# Foundation are already linked by tauri/tao, so we only need the objc shim.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[package]
name = "graph-explorer-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.1" }

[dependencies]
anyhow = "1.0"
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# V-13. The content hash is the join key between this crate and gx-core, so it
# has to be the SAME hash: SHA-256 over the file's bytes. The previous
# `DefaultHasher` was a u64 SipHash over a lossily-decoded String — a different
# algorithm, a different width, and explicitly not stable across Rust releases.
sha2 = "0.10"
tauri = { version = "2.1.1", features = ["image-png"] }

# P5 deleted four dependencies along with the loopback HTTP server (D4):
# tiny_http (the server), base64 + rand (the token it needed), and urlencoding
# (the path decoding that only URLs required). The control channel is a unix
# socket carrying newline-delimited JSON, which std can do on its own.

# Windows has supported AF_UNIX since 1803, but Rust's std does not expose it
# there. This crate does, mirroring the std API — so one transport serves all
# three platforms and `gx` needs one client rather than two.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"

# macOS only: set the Dock icon at runtime. This binary is unbundled (no
# .app/.icns) so the Dock would otherwise show the generic icon. AppKit and
# Foundation are already linked by tauri/tao, so we only need the objc shim.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

name: Local Capabilities Smoke

on:
  pull_request:
  push:
    branches:
      - dev
      - release
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

# Opt all JavaScript actions into Node 24 (actions/checkout, setup-*,
# upload/download-artifact still ship Node 20, which GitHub is deprecating).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-smoke:
    name: Rust smoke (desktop + gx)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check desktop crate
        working-directory: desktop/src-tauri
        run: cargo check --locked

      - name: Check gx crate
        working-directory: gx
        run: cargo check --locked

  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # JS library facades are hand-written and checked in, so the Scala.js
      # compile needs nothing from node_modules; `npm run build` below does.
      - name: Install npm modules
        run: npm install

      - name: Compile Scala.js (optimized)
        run: sbt -J-Xmx2G viewer/fullLinkJS

      - name: Build frontend bundle
        run: npm run build

      # The prod desktop build embeds frontendDist (../../dist) at compile
      # time via generate_context!. dist/ is gitignored, so it must be built
      # here and handed to the (Rust-only) packaging matrix as an artifact.
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          if-no-files-found: error
          path: dist

  release-packaging:
    name: Release packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            patchelf

      # The `tauri/custom-protocol` feature is REQUIRED: tauri's build script
      # sets `dev = !custom-protocol`, so a release build without it is still a
      # *dev* build that loads devUrl instead of the embedded frontend (blank
      # window). `cargo clean -p` + `-vv` forces the build script to run so we
      # can fail the job if it ever regresses to a dev build.
      - name: Build desktop release (assert production build)
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          cargo clean -p graph-explorer-desktop
          cargo build --release --locked --features tauri/custom-protocol -vv 2>&1 | tee build.log
          if grep -q 'cargo:rustc-cfg=dev' build.log; then
            echo "::error::desktop built in DEV mode (tauri custom-protocol feature missing) -> blank window"
            exit 1
          fi

      - name: Build gx release
        working-directory: gx
        run: cargo build --release --locked

      - name: macOS runtime smoke (release binaries)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-release-smoke.sh

      - name: Linux runtime smoke (release binaries)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-release-smoke.sh

      # LC2-T5: external file edit must reach the UI push boundary in <=300ms
      # median. Windows is excluded while its path bug is parked (the script
      # uses gx watch/get and would hit the same defect).
      - name: macOS disk->UI smoke (LC2-T5)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-disk-to-ui-smoke.sh

      - name: Linux disk->UI smoke (LC2-T5)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-disk-to-ui-smoke.sh

      # Non-blocking: the Windows desktop binary builds correctly, but the
      # runtime smoke hits a known gx/desktop path-normalization bug on Windows
      # (gx get -> exit 4 EXIT_INVALID_PATH_OR_PERMISSION while watch succeeds).
      # Tracked as a residual risk in docs/local-capabilities-v1-go-no-go.md.
      # Remove continue-on-error once the Windows path bug is fixed.
      - name: Windows runtime smoke (release binaries)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $gx = "gx/target/release/gx.exe"
          $desktop = "desktop/src-tauri/target/release/graph-explorer-desktop.exe"
          if (-not (Test-Path $gx)) { throw "missing gx binary: $gx" }
          if (-not (Test-Path $desktop)) { throw "missing desktop binary: $desktop" }

          Get-Process graph-explorer-desktop -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "$HOME/.graph-explorer/runtime/control.json" -ErrorAction SilentlyContinue

          $desktopProc = Start-Process -FilePath $desktop -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              $statusJson = & $gx status --json 2>$null
              if ($LASTEXITCODE -eq 0 -and $statusJson) {
                $status = $statusJson | ConvertFrom-Json
                if ($status.running -eq $true) {
                  $ready = $true
                  break
                }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "desktop control API did not become ready" }

            $tmp = Join-Path $env:TEMP ("gx-release-smoke-" + [guid]::NewGuid().ToString("N") + ".dot")
            @"
          digraph G {
            a -> b
          }
          "@ | Set-Content -Path $tmp -NoNewline

            & $gx watch $tmp --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "watch failed with exit code $LASTEXITCODE" }
            & $gx get --file $tmp --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "get failed with exit code $LASTEXITCODE" }
            & $gx set --file $tmp --text "digraph G {`n  b -> c`n}`n" --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "set failed with exit code $LASTEXITCODE" }
            & $gx set --file $tmp --text "digraph G {`n  stale -> write`n}`n" --base-revision 1 --json | Out-Null
            $staleExit = $LASTEXITCODE
            if ($staleExit -ne 5) { throw "stale write should exit 5, got $staleExit" }
            & $gx unwatch $tmp --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "unwatch failed with exit code $LASTEXITCODE" }
            Remove-Item $tmp -ErrorAction SilentlyContinue
          }
          finally {
            if ($desktopProc -and -not $desktopProc.HasExited) {
              Stop-Process -Id $desktopProc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-capabilities-${{ runner.os }}-release
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/graph-explorer-desktop*
            gx/target/release/gx*

name: Local Capabilities Smoke

on:
  pull_request:
  push:
    branches:
      - dev
      - release
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

# Runs any JavaScript action that still targets Node 20 on Node 24 instead.
#
# After the v5 bump every actions/* here is natively Node 24, so this now covers
# only the third-party actions the repo does not control (sbt/setup-sbt,
# Swatinem/rust-cache, VirtusLab/scala-cli-setup, softprops/action-gh-release,
# scalacenter/sbt-dependency-submission).
#
# NOTE it does not silence the deprecation annotation — it CAUSES the "are being
# forced to run on Node.js 24" wording. The annotation names the offenders,
# which is how the v5 bump knew what to bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-smoke:
    name: Rust smoke (desktop)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # `test` rather than `check`: the desktop's query-parameter decoding is
      # covered by unit tests (including Windows-shaped paths, which no
      # macOS/Linux runtime smoke can exercise), and a check-only job would
      # never run them.
      - name: Test desktop crate
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # The gx crate is gone: gx is Scala now (D2) and its tests run under
      # `sbt testFull` with the rest of the build.

  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # JS library facades are hand-written and checked in, so the Scala.js
      # compile needs nothing from node_modules; `npm run build` below does.
      - name: Install npm modules
        run: npm install

      - name: Compile Scala.js (optimized)
        run: sbt -J-Xmx2G viewer/fullLinkJS

      - name: Build frontend bundle
        run: npm run build

      # The prod desktop build embeds frontendDist (../../dist) at compile
      # time via generate_context!. dist/ is gitignored, so it must be built
      # here and handed to the (Rust-only) packaging matrix as an artifact.
      - name: Upload frontend dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          if-no-files-found: error
          path: dist

  release-packaging:
    name: Release packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            patchelf

      # The `tauri/custom-protocol` feature is REQUIRED: tauri's build script
      # sets `dev = !custom-protocol`, so a release build without it is still a
      # *dev* build that loads devUrl instead of the embedded frontend (blank
      # window). `cargo clean -p` + `-vv` forces the build script to run so we
      # can fail the job if it ever regresses to a dev build.
      - name: Build desktop release (assert production build)
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          cargo clean -p graph-explorer-desktop
          cargo build --release --locked --features tauri/custom-protocol -vv 2>&1 | tee build.log
          if grep -q 'cargo:rustc-cfg=dev' build.log; then
            echo "::error::desktop built in DEV mode (tauri custom-protocol feature missing) -> blank window"
            exit 1
          fi

      - name: Set up scala-cli (for the gx native image)
        uses: VirtusLab/scala-cli-setup@v1

      # sbt too: this job only ever set up Rust, because building gx used to be
      # `cargo build`. scripts/build-gx.sh asks sbt for the classpath first.
      # (scala-cli-setup already provides the JDK it runs on.)
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
        with:
          # NO disk cache on the gx build.
          #
          # sbt 2's disk cache stores TASK OUTPUTS, including the meta-build
          # compile that turns project/PWEnv.scala into `jsenv.playwright`. On a
          # hit, sbt skips `compiling 1 Scala source` -- and if the restored
          # entry does not actually materialize those classes into target/out,
          # build.sbt fails at `Test / jsEnv` with:
          #
          #     Not found: jsenv - did you mean jsEnv?
          #
          # That is what broke every macOS release after v0.8.0, and the log
          # timestamps name the culprit exactly. The one macOS release run that
          # ever SUCCEEDED missed the cache, compiled, uploaded its assets at
          # 00:04:36 -- and saved the entry at 00:04:41. Both dispatches after it
          # hit that key, printed no compile line, and died on build.sbt. Linux
          # survived only because its branch-scope entry happens to hold 67 KB of
          # nothing while macOS's holds 9 MB.
          #
          # A release build should not consume a task-output cache it did not
          # produce, so this is the right setting on its own merits. Keep it in
          # step with the mirror of this job in local-capabilities-smoke.yml --
          # the two drifting is what hid this for two releases.
          disk-cache: false

      - name: Put coursier bin dir on PATH
        shell: bash
        run: echo "$COURSIER_BIN_DIR" >> "$GITHUB_PATH"

      # A second of stubbed checks before the expensive gates. The helper's
      # status channel broke silently once and cost two CI cycles to find,
      # because nothing could exercise it without a built desktop.
      - name: Control-API helper self-test
        shell: bash
        run: ./scripts/lib/control-api-selftest.sh

      - name: Build gx release (GraalVM native-image)
        shell: bash
        run: ./scripts/build-gx.sh

      - name: macOS runtime smoke (release binaries)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-release-smoke.sh

      - name: Linux runtime smoke (release binaries)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-release-smoke.sh

      # LC2-T5: external file edit must reach the UI push boundary in <=300ms
      # median. Windows is excluded because the harness is a bash script
      # (mktemp/pkill/jq), not because of the path defect it used to hit; the
      # Windows runtime smoke below covers the same watch/get/set path.
      - name: macOS disk->UI smoke (LC2-T5)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-disk-to-ui-smoke.sh

      - name: Linux disk->UI smoke (LC2-T5)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-disk-to-ui-smoke.sh

      # Blocking. This step used to carry continue-on-error for a defect where a
      # URL-carried path returned 400 while `watch` succeeded: the desktop
      # decoded the `path` query parameter by replacing '%2F' with '/' and
      # nothing else, so a canonical Windows path (whose \ : ? all need
      # decoding) never matched the watch registry. Since P5 there are no URLs
      # to decode -- the path is a JSON string on a unix socket (D4) -- but the
      # Windows case is kept because it is the platform where AF_UNIX is newest.
      - name: Windows runtime smoke (release binaries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/local-capabilities-release-smoke.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: local-capabilities-${{ runner.os }}-release
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/graph-explorer-desktop*
            gx-cli/target/gx*

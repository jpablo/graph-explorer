name: Local Capabilities Smoke

on:
  pull_request:
  push:
    branches:
      - dev
      - release
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

# Runs any JavaScript action that still targets Node 20 on Node 24 instead.
#
# After the v5 bump every actions/* here is natively Node 24, so this now covers
# only the third-party actions the repo does not control (sbt/setup-sbt,
# Swatinem/rust-cache, VirtusLab/scala-cli-setup, softprops/action-gh-release,
# scalacenter/sbt-dependency-submission).
#
# NOTE it does not silence the deprecation annotation — it CAUSES the "are being
# forced to run on Node.js 24" wording. The annotation names the offenders,
# which is how the v5 bump knew what to bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-smoke:
    name: Rust smoke (desktop)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # `test` rather than `check`: the desktop's query-parameter decoding is
      # covered by unit tests (including Windows-shaped paths, which no
      # macOS/Linux runtime smoke can exercise), and a check-only job would
      # never run them.
      - name: Test desktop crate
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # The gx crate is gone: gx is Scala now (D2) and its tests run under
      # `sbt testFull` with the rest of the build.

  # `build-frontend` and `release-packaging` used to live here: a
  # hand-maintained MIRROR of release-binaries.yml's jobs, existing only
  # because that workflow was tag-triggered and so nothing exercised it on a
  # PR. Being a copy, it drifted -- P2 converted only this copy's Windows
  # gate to D1 content hashes, leaving the real release asserting
  # `revision -ne 1` and failing v0.9.0.
  #
  # release-binaries.yml now runs on `pull_request` itself, publishing only
  # when the event is not a PR, so a PR exercises the ORIGINAL rather than a
  # likeness of it -- and there is no second copy left to drift. Do not
  # reintroduce a mirror here; add to that workflow instead.

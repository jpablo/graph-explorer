name: Local Capabilities Smoke

on:
  pull_request:
  push:
    branches:
      - dev
      - release
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

# Opt all JavaScript actions into Node 24 (actions/checkout, setup-*,
# upload/download-artifact still ship Node 20, which GitHub is deprecating).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-smoke:
    name: Rust smoke (desktop)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # `test` rather than `check`: the desktop's query-parameter decoding is
      # covered by unit tests (including Windows-shaped paths, which no
      # macOS/Linux runtime smoke can exercise), and a check-only job would
      # never run them.
      - name: Test desktop crate
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # The gx crate is gone: gx is Scala now (D2) and its tests run under
      # `sbt testFull` with the rest of the build.

  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # JS library facades are hand-written and checked in, so the Scala.js
      # compile needs nothing from node_modules; `npm run build` below does.
      - name: Install npm modules
        run: npm install

      - name: Compile Scala.js (optimized)
        run: sbt -J-Xmx2G viewer/fullLinkJS

      - name: Build frontend bundle
        run: npm run build

      # The prod desktop build embeds frontendDist (../../dist) at compile
      # time via generate_context!. dist/ is gitignored, so it must be built
      # here and handed to the (Rust-only) packaging matrix as an artifact.
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          if-no-files-found: error
          path: dist

  release-packaging:
    name: Release packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            patchelf

      # The `tauri/custom-protocol` feature is REQUIRED: tauri's build script
      # sets `dev = !custom-protocol`, so a release build without it is still a
      # *dev* build that loads devUrl instead of the embedded frontend (blank
      # window). `cargo clean -p` + `-vv` forces the build script to run so we
      # can fail the job if it ever regresses to a dev build.
      - name: Build desktop release (assert production build)
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          cargo clean -p graph-explorer-desktop
          cargo build --release --locked --features tauri/custom-protocol -vv 2>&1 | tee build.log
          if grep -q 'cargo:rustc-cfg=dev' build.log; then
            echo "::error::desktop built in DEV mode (tauri custom-protocol feature missing) -> blank window"
            exit 1
          fi

      - name: Set up scala-cli (for the gx native image)
        uses: VirtusLab/scala-cli-setup@v1

      - name: Put coursier bin dir on PATH
        shell: bash
        run: echo "$COURSIER_BIN_DIR" >> "$GITHUB_PATH"

      - name: Build gx release (GraalVM native-image)
        shell: bash
        run: ./scripts/build-gx.sh

      - name: macOS runtime smoke (release binaries)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-release-smoke.sh

      - name: Linux runtime smoke (release binaries)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-release-smoke.sh

      # LC2-T5: external file edit must reach the UI push boundary in <=300ms
      # median. Windows is excluded because the harness is a bash script
      # (mktemp/pkill/jq), not because of the path defect it used to hit; the
      # Windows runtime smoke below covers the same watch/get/set path.
      - name: macOS disk->UI smoke (LC2-T5)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-disk-to-ui-smoke.sh

      - name: Linux disk->UI smoke (LC2-T5)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-disk-to-ui-smoke.sh

      # Blocking as of the path-decoding fix. This step used to carry
      # continue-on-error for a defect where a URL-carried path returned 400 while
      # `watch` succeeded: the desktop decoded the `path` query parameter by
      # replacing '%2F' with '/' and nothing else, so a canonical Windows path
      # (whose \ : ? all need decoding) never matched the watch registry.
      - name: Windows runtime smoke (release binaries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Drives the desktop's control API directly. gx is Scala now and
          # speaks no HTTP (D2, D4), so routing the DESKTOP's publish gate
          # through it would test a client we are replacing rather than the
          # contract we are keeping.
          $desktop = "desktop/src-tauri/target/release/graph-explorer-desktop.exe"
          $gx = "gx-cli/target/gx.exe"
          if (-not (Test-Path $desktop)) { throw "missing desktop binary: $desktop" }
          if (-not (Test-Path $gx)) { throw "missing gx binary: $gx" }
          $control = Join-Path $HOME ".graph-explorer/runtime/control.json"

          function Invoke-Control($method, $path, $body) {
            $c = Get-Content $control -Raw | ConvertFrom-Json
            $headers = @{ Authorization = "Bearer $($c.token)" }
            $uri = "http://127.0.0.1:$($c.port)$path"
            if ($body) {
              Invoke-RestMethod -Method $method -Uri $uri -Headers $headers `
                -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress)
            } else {
              Invoke-RestMethod -Method $method -Uri $uri -Headers $headers
            }
          }

          Get-Process graph-explorer-desktop -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "$HOME/.graph-explorer/runtime/control.json" -ErrorAction SilentlyContinue

          $desktopProc = Start-Process -FilePath $desktop -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              if (Test-Path $control) {
                try {
                  $status = Invoke-Control GET "/v1/status" $null
                  if ($status.running -eq $true) { $ready = $true; break }
                } catch { }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "desktop control API did not become ready" }

            $tmp = Join-Path $env:TEMP ("gx-release-smoke-" + [guid]::NewGuid().ToString("N") + ".dot")
            @"
          digraph G {
            a -> b
          }
          "@ | Set-Content -Path $tmp -NoNewline

            # A Windows path exercises every character the URL-carried `path`
            # of GET /v1/document has to survive: the drive colon, backslash
            # separators, and any \?\ prefix. That combination is what blocked
            # Windows in v1.
            $watch = Invoke-Control POST "/v1/watch" @{ path = $tmp; openInUi = $true }
            if ($watch.watch.revision -ne 1) { throw "watch revision: $($watch.watch.revision)" }

            $encoded = [uri]::EscapeDataString($tmp)
            $doc = Invoke-Control GET "/v1/document?path=$encoded" $null
            if ($doc.document.revision -ne 1) { throw "get revision: $($doc.document.revision)" }

            $put = Invoke-Control PUT "/v1/document" `
              @{ path = $tmp; text = "digraph G {`n  b -> c`n}`n"; baseRevision = 1; source = "cli" }
            if ($put.document.revision -ne 2) { throw "set revision: $($put.document.revision)" }

            $stale = $null
            try {
              Invoke-Control PUT "/v1/document" `
                @{ path = $tmp; text = "digraph G {`n  stale`n}`n"; baseRevision = 1; source = "cli" }
            } catch { $stale = $_.Exception.Response.StatusCode.value__ }
            if ($stale -ne 409) { throw "stale write should be 409, got $stale" }

            $unwatch = Invoke-Control POST "/v1/unwatch" @{ path = $tmp }
            if ($unwatch.removed -ne $true) { throw "unwatch did not remove the watch" }

            # And that the shipped gx binary runs at all, headless.
            & $gx status | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "gx status failed with exit code $LASTEXITCODE" }

            Remove-Item $tmp -ErrorAction SilentlyContinue
          }
          finally {
            if ($desktopProc -and -not $desktopProc.HasExited) {
              Stop-Process -Id $desktopProc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-capabilities-${{ runner.os }}-release
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/graph-explorer-desktop*
            gx-cli/target/gx*

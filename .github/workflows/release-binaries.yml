name: Release binaries

# Triggered when scripts/bump-patch-version.sh pushes a vX.Y.Z tag (or via
# manual dispatch to (re)build assets for an existing tag). Builds the
# desktop/gx binaries on the same matrix as local-capabilities-smoke.yml,
# runs the runtime smoke as a per-platform publish gate, then attaches the
# artifacts to the GitHub Release for the tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)build and attach assets for
        required: true

# action-gh-release needs write access to create/attach to the Release.
permissions:
  contents: write

# Opt JavaScript actions into Node 24 (same rationale as the smoke workflow).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # JS library facades are hand-written and checked in, so the Scala.js
      # compile needs nothing from node_modules; `npm run build` below does.
      - name: Install npm modules
        run: npm install

      - name: Compile Scala.js (optimized)
        run: sbt -J-Xmx2G viewer/fullLinkJS

      - name: Build frontend bundle
        run: npm run build

      # The prod desktop build embeds ../../dist at compile time via
      # generate_context!. dist/ is gitignored, so hand it to the packaging
      # matrix as an artifact.
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          if-no-files-found: error
          path: dist

  release:
    name: Release (${{ matrix.os }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing its smoke gate must not block the others from
      # publishing their assets to the Release.
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            patchelf

      # macOS: produce a .dmg (which wraps the .app) via the Tauri bundler.
      # `tauri build` is implicitly a production build (sets custom-protocol),
      # so it does not need the explicit dev-build guard the raw cargo path
      # below uses. It also still emits the raw target/release binary that the
      # smoke scripts exercise.
      - name: Install Tauri CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install tauri-cli --version "^2"

      - name: Build desktop bundle (macOS .dmg + .app)
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        # bundle.active is false in tauri.conf.json, so name the targets
        # explicitly rather than relying on the default bundle set.
        run: cargo tauri build --bundles dmg,app

      # Linux/Windows: raw release binary. The tauri/custom-protocol feature is
      # REQUIRED -- without it the build script leaves `dev` set and the window
      # loads devUrl (blank window). Fail the job if it ever regresses.
      - name: Build desktop release (Linux/Windows, assert production build)
        if: runner.os != 'macOS'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          cargo clean -p graph-explorer-desktop
          cargo build --release --locked --features tauri/custom-protocol -vv 2>&1 | tee build.log
          if grep -q 'cargo:rustc-cfg=dev' build.log; then
            echo "::error::desktop built in DEV mode (tauri custom-protocol feature missing) -> blank window"
            exit 1
          fi

      - name: Set up scala-cli (for the gx native image)
        uses: VirtusLab/scala-cli-setup@v1

      # sbt too: this job only ever set up Rust, because building gx used to be
      # `cargo build`. scripts/build-gx.sh asks sbt for the classpath first.
      # (scala-cli-setup already provides the JDK it runs on.)
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Put coursier bin dir on PATH
        # The setup action installs into COURSIER_BIN_DIR but does not export it
        # to later steps on every runner.
        shell: bash
        run: echo "$COURSIER_BIN_DIR" >> "$GITHUB_PATH"

      # A second of stubbed checks before the expensive gates. The helper's
      # status channel broke silently once and cost two CI cycles to find,
      # because nothing could exercise it without a built desktop.
      - name: Control-API helper self-test
        shell: bash
        run: ./scripts/lib/control-api-selftest.sh

      - name: Build gx release (GraalVM native-image)
        # gx is Scala now (D2). The script pins the GraalVM version, passes
        # --no-fallback, and fails if native-image emits a JVM launcher instead
        # of a native binary — all three learned during the P0 gate.
        shell: bash
        run: ./scripts/build-gx.sh

      # --- Per-platform publish gate: smoke must pass to attach assets ---

      - name: macOS runtime smoke (release binaries)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-release-smoke.sh

      - name: macOS disk->UI smoke (LC2-T5)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-disk-to-ui-smoke.sh

      - name: Linux runtime smoke (release binaries)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-release-smoke.sh

      - name: Linux disk->UI smoke (LC2-T5)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-disk-to-ui-smoke.sh

      # Blocking as of the path-decoding fix, mirroring
      # local-capabilities-smoke.yml. `fail-fast: false` above keeps a Windows
      # failure from withholding the macOS and Linux assets: this gate decides
      # whether the *Windows* binaries get published, nothing else.
      - name: Windows runtime smoke (release binaries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Drives the desktop's control channel directly, rather than through
          # `gx`: this is the DESKTOP's publish gate, and routing it through the
          # reference client would test one client's view of the contract
          # instead of the contract.
          #
          # .NET speaks AF_UNIX natively (UnixDomainSocketEndPoint), which is
          # the third independent client of this protocol after the Rust server
          # and the Scala `gx` -- and the reason P5 chose one transport for all
          # platforms instead of D4's named pipe on Windows.
          $desktop = "desktop/src-tauri/target/release/graph-explorer-desktop.exe"
          $gx = "gx-cli/target/gx.exe"
          if (-not (Test-Path $desktop)) { throw "missing desktop binary: $desktop" }
          if (-not (Test-Path $gx)) { throw "missing gx binary: $gx" }
          $control = Join-Path $HOME ".graph-explorer/runtime/control.json"

          $script:rpcId = 0
          function Invoke-Control($method, $params) {
            $c = Get-Content $control -Raw | ConvertFrom-Json
            if (-not $c.socket) { throw "no socket recorded in $control" }

            $client = New-Object System.Net.Sockets.Socket(
              [System.Net.Sockets.AddressFamily]::Unix,
              [System.Net.Sockets.SocketType]::Stream,
              [System.Net.Sockets.ProtocolType]::Unspecified)
            try {
              # A stale socket file outlives a crashed desktop, so connecting is
              # the only thing that proves one is there.
              $client.Connect((New-Object System.Net.Sockets.UnixDomainSocketEndPoint($c.socket)))

              $script:rpcId++
              $frame = @{ id = $script:rpcId; method = $method; params = $params } |
                ConvertTo-Json -Compress -Depth 6
              # UTF-8 named explicitly: Windows' default charset is
              # windows-1252, and under D1 the bytes ARE the revision (V-16).
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($frame + "`n")
              [void]$client.Send($bytes)

              # Frames are newline-delimited; accumulate then decode ONCE, since
              # a recv can split mid-character.
              #
              # A MemoryStream, and no array slicing. `$chunk[0..($n-1)]` on a
              # byte[] produces System.Object[] in PowerShell — not byte[] — and
              # List[byte].AddRange rejects it. That cost a CI run, and it failed
              # as "the desktop never came up" because the readiness loop
              # swallowed the exception. Stream.Write(buffer, offset, count) has
              # no coercion step to get wrong.
              $stream = New-Object System.IO.MemoryStream
              $chunk = New-Object byte[] 65536
              $bytes = $null
              $newline = -1
              while ($true) {
                $n = $client.Receive($chunk)
                if ($n -le 0) { break }
                $stream.Write($chunk, 0, $n)
                $bytes = $stream.ToArray()
                $newline = [Array]::IndexOf([byte[]]$bytes, [byte]10)
                if ($newline -ge 0) { break }
              }
              if ($newline -lt 0) { throw "no response frame for '$method'" }
              $line = [System.Text.Encoding]::UTF8.GetString($bytes, 0, $newline)
              return $line | ConvertFrom-Json
            }
            finally { $client.Dispose() }
          }

          Get-Process graph-explorer-desktop -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "$HOME/.graph-explorer/runtime/control.json" -ErrorAction SilentlyContinue
          Remove-Item "$HOME/.graph-explorer/runtime/control.sock" -ErrorAction SilentlyContinue

          # The desktop's own output is captured, because the previous run failed
          # here with "did not become ready" and NOTHING else: the readiness loop
          # swallowed every exception, so a bind failure, a crash and a slow
          # start were indistinguishable. Same lesson as the helper's
          # `2>/dev/null` — the evidence was being discarded by the thing whose
          # job was to report it.
          $outLog = Join-Path $env:TEMP "gx-desktop-out.log"
          $errLog = Join-Path $env:TEMP "gx-desktop-err.log"
          $desktopProc = Start-Process -FilePath $desktop -PassThru `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $ready = $false
            $lastError = "(never attempted)"
            for ($i = 0; $i -lt 120; $i++) {
              # A dead process will never become ready. Waiting the full 30s for
              # one that exited in the first 200ms tells you nothing.
              if ($desktopProc.HasExited) { break }
              if (Test-Path $control) {
                try {
                  $status = Invoke-Control "status" @{}
                  if ($status.ok -and $status.result.running) { $ready = $true; break }
                  $lastError = "answered but not running: $($status | ConvertTo-Json -Compress)"
                } catch { $lastError = $_.Exception.Message }
              } else {
                $lastError = "control file not written yet"
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              Write-Host "--- why the control channel never came up ---"
              Write-Host "desktop exited : $($desktopProc.HasExited)"
              if ($desktopProc.HasExited) { Write-Host "exit code      : $($desktopProc.ExitCode)" }
              Write-Host "last error     : $lastError"
              $runtimeDir = Join-Path $HOME ".graph-explorer/runtime"
              Write-Host "runtime dir    : $runtimeDir"
              if (Test-Path $runtimeDir) {
                # Get-ChildItem rather than Test-Path on the socket: an AF_UNIX
                # socket on Windows is a reparse point, and Test-Path's answer
                # for one is not something to bet a diagnosis on.
                Get-ChildItem $runtimeDir -Force | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length)" }
              } else { Write-Host "  (absent)" }
              if (Test-Path $control) { Write-Host "control.json   : $(Get-Content $control -Raw)" }
              foreach ($log in @($outLog, $errLog)) {
                Write-Host "--- $log ---"
                if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "  $_" } }
              }
              throw "desktop control channel did not become ready"
            }

            # The credential is gone from the design (D4), and this is the file
            # that used to carry it.
            $raw = Get-Content $control -Raw | ConvertFrom-Json
            if ($raw.PSObject.Properties.Name -contains "token") { throw "runtime file still carries a token" }
            if ($raw.PSObject.Properties.Name -contains "port") { throw "runtime file still carries a port" }

            $tmp = Join-Path $env:TEMP ("gx-release-smoke-" + [guid]::NewGuid().ToString("N") + ".dot")
            @"
          digraph G {
            a -> b
          }
          "@ | Set-Content -Path $tmp -NoNewline

            # A Windows path is still the interesting case: the drive colon,
            # backslash separators, and any \?\ prefix. It used to be
            # interesting because a URL had to survive them; it is interesting
            # now because this is where the path crosses two languages' idea of
            # a JSON string.
            $watch = Invoke-Control "watch" @{ path = $tmp }
            if (-not $watch.ok) { throw "watch failed: $($watch.error.message)" }
            if ($watch.result.revision -ne 1) { throw "watch revision: $($watch.result.revision)" }

            $doc = Invoke-Control "get-document" @{ path = $tmp }
            if ($doc.result.document.revision -ne 1) { throw "get revision: $($doc.result.document.revision)" }
            if ($doc.result.document.path -ne $tmp) { throw "path came back changed: $($doc.result.document.path)" }

            $put = Invoke-Control "put-document" `
              @{ path = $tmp; text = "digraph G {`n  b -> c`n}`n"; baseRevision = 1; source = "cli" }
            if ($put.result.document.revision -ne 2) { throw "set revision: $($put.result.document.revision)" }

            # A conflict is an error FRAME now, not an HTTP status. It is also
            # not an exception: the desktop answered.
            $stale = Invoke-Control "put-document" `
              @{ path = $tmp; text = "digraph G {`n  stale`n}`n"; baseRevision = 1; source = "cli" }
            if ($stale.ok) { throw "a stale write should have been refused" }
            if ($stale.error.code -ne "DOCUMENT_CONFLICT") { throw "stale write code: $($stale.error.code)" }
            if ($stale.error.currentRevision -ne 2) { throw "stale currentRevision: $($stale.error.currentRevision)" }

            $unwatch = Invoke-Control "unwatch" @{ path = $tmp }
            if ($unwatch.result.removed -ne $true) { throw "unwatch did not remove the watch" }

            # And that the shipped gx binary runs at all, headless -- plus that
            # its own socket client reaches the same desktop this step just did.
            & $gx status | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "gx status failed with exit code $LASTEXITCODE" }

            & $gx open $tmp | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "gx open failed with exit code $LASTEXITCODE" }

            Remove-Item $tmp -ErrorAction SilentlyContinue
          }
          finally {
            if ($desktopProc -and -not $desktopProc.HasExited) {
              Stop-Process -Id $desktopProc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      # --- Stage assets with OS- and tag-tagged names (no collisions) ---

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-dist
          case "${{ runner.os }}" in
            macOS)
              dmg="$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -n1)"
              if [[ -z "${dmg}" ]]; then echo "::error::no .dmg produced"; exit 1; fi
              cp "${dmg}" "release-dist/graph-explorer-desktop-${tag}-macos.dmg"
              cp gx-cli/target/gx "release-dist/gx-${tag}-macos"
              ;;
            Linux)
              cp desktop/src-tauri/target/release/graph-explorer-desktop \
                "release-dist/graph-explorer-desktop-${tag}-linux"
              cp gx-cli/target/gx "release-dist/gx-${tag}-linux"
              ;;
            Windows)
              cp desktop/src-tauri/target/release/graph-explorer-desktop.exe \
                "release-dist/graph-explorer-desktop-${tag}-windows.exe"
              cp gx-cli/target/gx.exe "release-dist/gx-${tag}-windows.exe"
              ;;
          esac
          ls -la release-dist

      - name: Attach assets to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: release-dist/*

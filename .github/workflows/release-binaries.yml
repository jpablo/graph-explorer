name: Release binaries

# Triggered when scripts/bump-patch-version.sh pushes a vX.Y.Z tag (or via
# manual dispatch to (re)build assets for an existing tag). Builds the
# desktop/gx binaries on the same matrix as local-capabilities-smoke.yml,
# runs the runtime smoke as a per-platform publish gate, then attaches the
# artifacts to the GitHub Release for the tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)build and attach assets for
        required: true

# action-gh-release needs write access to create/attach to the Release.
permissions:
  contents: write

# Runs any JavaScript action that still targets Node 20 on Node 24 instead.
#
# After the v5 bump every actions/* here is natively Node 24, so this now covers
# only the third-party actions the repo does not control (sbt/setup-sbt,
# Swatinem/rust-cache, VirtusLab/scala-cli-setup, softprops/action-gh-release,
# scalacenter/sbt-dependency-submission).
#
# NOTE it does not silence the deprecation annotation — it CAUSES the "are being
# forced to run on Node.js 24" wording. The annotation names the offenders,
# which is how the v5 bump knew what to bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # macOS release signing + notarization. Every one of these resolves to an
  # empty string until the matching repo secret exists, which is the signal
  # the release job uses to decide whether to sign.
  #
  # NOTE these are defined for EVERY step, so "no secret" means SET-BUT-EMPTY
  # rather than absent — and Tauri's bundler decides to sign on presence, not
  # on value. The macOS build step therefore unsets them when there is no
  # identity; see the comment there. docs/macos-release-signing.md has the
  # one-time setup for the secrets.
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'graph-explorer-ci' }}

jobs:
  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # JS library facades are hand-written and checked in, so the Scala.js
      # compile needs nothing from node_modules; `npm run build` below does.
      - name: Install npm modules
        run: npm install

      - name: Compile Scala.js (optimized)
        run: sbt -J-Xmx2G viewer/fullLinkJS

      - name: Build frontend bundle
        run: npm run build

      # The prod desktop build embeds ../../dist at compile time via
      # generate_context!. dist/ is gitignored, so hand it to the packaging
      # matrix as an artifact.
      - name: Upload frontend dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          if-no-files-found: error
          path: dist

  release:
    name: Release (${{ matrix.os }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One platform failing its smoke gate must not block the others from
      # publishing their assets to the Release.
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      # The release is tagged vX.Y.Z, but the app version lives in two static
      # scaffold files (both 0.1.0 since the v0 desktop was added). Without
      # this, the DMG is named v0.7.0 while the app's Info.plist (and thus
      # `About`, crash reports, and anything a user checks to confirm they
      # have the release) still says 0.1.0. Sync them from the tag so the
      # binary, the bundle, and the filename agree.
      - name: Set app version from the release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          [[ -n "${version}" ]] || { echo "no release version derivable from tag '${tag}'"; exit 1; }
          jq --arg v "${version}" '.version = $v' desktop/src-tauri/tauri.conf.json > tmp.conf \
            && mv tmp.conf desktop/src-tauri/tauri.conf.json
          # No `sed -i`: BSD and GNU sed disagree on its -i syntax, and this
          # step runs on all three runners.
          sed -e "s/^version = \"[0-9.]*\"/version = \"${version}\"/" desktop/src-tauri/Cargo.toml > tmp.cargo \
            && mv tmp.cargo desktop/src-tauri/Cargo.toml
          echo "release version: ${version}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            patchelf

      # macOS: produce a .dmg (which wraps the .app) via the Tauri bundler.
      # `tauri build` is implicitly a production build (sets custom-protocol),
      # so it does not need the explicit dev-build guard the raw cargo path
      # below uses. It also still emits the raw target/release binary that the
      # smoke scripts exercise.
      #
      # Signing: if the APPLE_CERTIFICATE secret exists, import the Developer
      # ID certificate into a build keychain and remember its identity name in
      # CERT_ID. The bundler step then signs the .app and the .dmg with it, and
      # (with APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID present) Tauri
      # notarizes + staples the .app. Tauri does NOT notarize the .dmg (it only
      # codesigns it -- tauri-apps/tauri#7533) and never touches gx (a
      # standalone binary, not a Tauri sidecar), so the "Notarize and staple
      # DMG and gx" step after the smoke closes those two gaps. Without the
      # secret nothing is signed at all -- exactly today's behavior.
      - name: Import Apple Developer certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "${APPLE_CERTIFICATE}" | base64 --decode > certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" build.keychain
          CERT_INFO="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' || true)"
          [[ -n "${CERT_INFO}" ]] || { echo "no 'Developer ID Application' identity after import"; exit 1; }
          CERT_ID="$(echo "${CERT_INFO}" | awk -F'"' '{print $2}')"
          echo "CERT_ID=${CERT_ID}" >> "$GITHUB_ENV"
          echo "imported signing identity: ${CERT_ID}"

      - name: Install Tauri CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install tauri-cli --version "^2"

      - name: Build desktop bundle (macOS .dmg + .app)
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        shell: bash
        # bundle.active is false in tauri.conf.json, so name the targets
        # explicitly rather than relying on the default bundle set.
        #
        # APPLE_SIGNING_IDENTITY is exported ONLY when the cert secret exists:
        # Tauri's keychain lookup returns None for a *missing* identity (skip
        # signing entirely) but Some for '-' (ad-hoc). Ad-hoc must NOT be
        # forced here, because codesign refuses to ad-hoc sign disk images
        # ("ad-hoc codesigning is not supported for disk images") -- that
        # would break the secret-less release path, which must keep building
        # unsigned exactly as it always has. Developer ID + notarization is
        # the only way a downloaded DMG opens without Privacy & Security
        # fiddling; the verify step after the smoke gates that outcome.
        run: |
          set -euo pipefail
          if [[ -n "${CERT_ID:-}" ]]; then
            export APPLE_SIGNING_IDENTITY="${CERT_ID}"
            echo "signing with: ${CERT_ID}"
          else
            # UNSET, not empty. The workflow-level `env:` block defines these
            # for every step, so with no secrets they arrive here SET to the
            # empty string — and Tauri's bundler treats PRESENCE as intent. It
            # ran `security import` on an empty certificate and failed the
            # whole macOS job with "failed to import keychain certificate",
            # which is how v0.8.0 shipped without any macOS assets.
            #
            # `${VAR:-}` reads the same for unset and empty; a bundler asking
            # "is this variable defined" does not. Removing them restores the
            # secret-less path the comment above always claimed to have.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "no APPLE_CERTIFICATE secret: signing skipped (no identity available), no notarization"
          fi
          cargo tauri build --bundles dmg,app

      # Linux/Windows: raw release binary. The tauri/custom-protocol feature is
      # REQUIRED -- without it the build script leaves `dev` set and the window
      # loads devUrl (blank window). Fail the job if it ever regresses.
      - name: Build desktop release (Linux/Windows, assert production build)
        if: runner.os != 'macOS'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          cargo clean -p graph-explorer-desktop
          cargo build --release --locked --features tauri/custom-protocol -vv 2>&1 | tee build.log
          if grep -q 'cargo:rustc-cfg=dev' build.log; then
            echo "::error::desktop built in DEV mode (tauri custom-protocol feature missing) -> blank window"
            exit 1
          fi

      - name: Set up scala-cli (for the gx native image)
        uses: VirtusLab/scala-cli-setup@v1

      # sbt too: this job only ever set up Rust, because building gx used to be
      # `cargo build`. scripts/build-gx.sh asks sbt for the classpath first.
      # (scala-cli-setup already provides the JDK it runs on.)
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
        with:
          # NO disk cache on the gx build.
          #
          # sbt 2's disk cache stores TASK OUTPUTS, including the meta-build
          # compile that turns project/PWEnv.scala into `jsenv.playwright`. On a
          # hit, sbt skips `compiling 1 Scala source` -- and if the restored
          # entry does not actually materialize those classes into target/out,
          # build.sbt fails at `Test / jsEnv` with:
          #
          #     Not found: jsenv - did you mean jsEnv?
          #
          # That is what broke every macOS release after v0.8.0, and the log
          # timestamps name the culprit exactly. The one macOS release run that
          # ever SUCCEEDED missed the cache, compiled, uploaded its assets at
          # 00:04:36 -- and saved the entry at 00:04:41. Both dispatches after it
          # hit that key, printed no compile line, and died on build.sbt. Linux
          # survived only because its branch-scope entry happens to hold 67 KB of
          # nothing while macOS's holds 9 MB.
          #
          # A release build should not consume a task-output cache it did not
          # produce, so this is the right setting on its own merits. Keep it in
          # step with the mirror of this job in local-capabilities-smoke.yml --
          # the two drifting is what hid this for two releases.
          disk-cache: false

      - name: Put coursier bin dir on PATH
        # The setup action installs into COURSIER_BIN_DIR but does not export it
        # to later steps on every runner.
        shell: bash
        run: echo "$COURSIER_BIN_DIR" >> "$GITHUB_PATH"

      # A second of stubbed checks before the expensive gates. The helper's
      # status channel broke silently once and cost two CI cycles to find,
      # because nothing could exercise it without a built desktop.
      - name: Control-API helper self-test
        shell: bash
        run: ./scripts/lib/control-api-selftest.sh

      - name: Build gx release (GraalVM native-image)
        # gx is Scala now (D2). The script pins the GraalVM version, passes
        # --no-fallback, and fails if native-image emits a JVM launcher instead
        # of a native binary — all three learned during the P0 gate.
        shell: bash
        run: ./scripts/build-gx.sh

      # --- Per-platform publish gate: smoke must pass to attach assets ---

      - name: macOS runtime smoke (release binaries)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-release-smoke.sh

      - name: macOS disk->UI smoke (LC2-T5)
        if: runner.os == 'macOS'
        run: ./scripts/local-capabilities-disk-to-ui-smoke.sh

      - name: Linux runtime smoke (release binaries)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-release-smoke.sh

      - name: Linux disk->UI smoke (LC2-T5)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./scripts/local-capabilities-disk-to-ui-smoke.sh

      # Blocking as of the path-decoding fix, mirroring
      # local-capabilities-smoke.yml. `fail-fast: false` above keeps a Windows
      # failure from withholding the macOS and Linux assets: this gate decides
      # whether the *Windows* binaries get published, nothing else.
      - name: Windows runtime smoke (release binaries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/local-capabilities-release-smoke.ps1

      # Notarize and staple the two artifacts Tauri leaves un-notarized.
      # Tauri notarizes + staples the .app, but (a) it only codesigns the .dmg
      # without notarizing it (tauri-apps/tauri#7533), and (b) it never touches
      # gx, which is a standalone native binary, not a Tauri sidecar. Both are
      # the artifacts a user actually downloads and runs, so both get signed,
      # notarized, and stapled here. Runs after the smoke gates on purpose:
      # those launch the RAW target/release binary, not the re-signed .app, so
      # re-signing cannot disturb them. Fails the (macOS) job on any error.
      - name: Notarize and staple DMG and gx (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          [[ -n "${dmg}" ]] || { echo "no .dmg found to notarize"; exit 1; }
          chmod +x scripts/macos-notarize-staple.sh
          # --no-codesign: Tauri already codesigned the .dmg.
          ./scripts/macos-notarize-staple.sh --no-codesign "${CERT_ID}" "${dmg}"
          # gx is signed from scratch here (it has no signature yet), and
          # stapling is not supported for raw Mach-O binaries, so
          # --no-staple: signed + notarized is the terminal state for it.
          ./scripts/macos-notarize-staple.sh --no-staple "${CERT_ID}" gx-cli/target/gx

      # The publish gate for the signing pipeline itself. When the cert secret
      # is present, the assets MUST be Developer ID signed and carry a stapled
      # notarization ticket -- the property that makes a downloaded DMG open
      # without the user touching Privacy & Security. Failing here withholds
      # the macOS assets instead of publishing them half-signed. Without the
      # secret this step is skipped: ad-hoc is the known status quo, and
      # docs/macos-release-signing.md says what a user of v0.7.0-era assets
      # has to do in the meantime.
      - name: Verify signature and notarization (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          app="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          [[ -n "${app}" && -n "${dmg}" ]] || { echo "no .app/.dmg found"; exit 1; }
          echo "--- .app signature ---"
          codesign --verify --deep --strict --verbose=2 "${app}"
          identity="$(codesign -dv "${app}" 2>&1 | sed -n 's/^[[:space:]]*Authority=//p' | head -n1)"
          echo "authority: ${identity}"
          case "${identity}" in
            "Developer ID Application"*) : ;;
            *) echo "FAIL: not signed with Developer ID Application (got: '${identity}')"; exit 1 ;;
          esac
          echo "--- notarization tickets ---"
          xcrun stapler validate "${dmg}"
          xcrun stapler validate "${app}"
          echo "--- gx signature ---"
          # gx is a raw binary: signed + notarized, but NOT stapled (stapling
          # is not supported for Mach-O), so its Gatekeeper check is online.
          codesign --verify --strict gx-cli/target/gx

      # --- Stage assets with OS- and tag-tagged names (no collisions) ---

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-dist
          case "${{ runner.os }}" in
            macOS)
              dmg="$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -n1)"
              if [[ -z "${dmg}" ]]; then echo "::error::no .dmg produced"; exit 1; fi
              cp "${dmg}" "release-dist/graph-explorer-desktop-${tag}-macos.dmg"
              cp gx-cli/target/gx "release-dist/gx-${tag}-macos"
              ;;
            Linux)
              cp desktop/src-tauri/target/release/graph-explorer-desktop \
                "release-dist/graph-explorer-desktop-${tag}-linux"
              cp gx-cli/target/gx "release-dist/gx-${tag}-linux"
              ;;
            Windows)
              cp desktop/src-tauri/target/release/graph-explorer-desktop.exe \
                "release-dist/graph-explorer-desktop-${tag}-windows.exe"
              cp gx-cli/target/gx.exe "release-dist/gx-${tag}-windows.exe"
              ;;
          esac
          ls -la release-dist

      - name: Attach assets to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: release-dist/*

  # needs: release covers ALL matrix legs, so this job only runs when every
  # platform's assets were attached -- which is what makes the checksum file
  # trustworthy: it lists exactly the assets that exist on the Release, and it
  # exists only when the whole release is complete. A failed leg means no
  # SHA256SUMS, which is the right outcome (a checksum file for half the
  # assets is worse than none).
  #
  # v0.7.0 shipped with no published checksum for any asset; the verification
  # of the gx binary was "compare it against a download from another machine".
  # This closes that gap for everything going forward.
  publish-checksums:
    name: Publish SHA256SUMS
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download release assets and compute SHA256SUMS
        shell: bash
        # `gh` in Actions authenticates from GH_TOKEN and nothing else — it does
        # not inherit the job's implicit token. Without this the whole job exits
        # 4 on its first call with "set the GH_TOKEN environment variable", which
        # is what it did on every run since this job was added: v0.7.0 predates
        # it, so v0.8.0 was the first release to reach it, and no SHA256SUMS has
        # ever been published.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh api "repos/${{ github.repository }}/releases/tags/${tag}" \
            --jq '.assets[] | .name' | sort | while IFS= read -r name; do
            case "${name}" in
              SHA256SUMS*) continue ;;
            esac
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern "${name}" --dir assets
          done
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Attach SHA256SUMS to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: SHA256SUMS

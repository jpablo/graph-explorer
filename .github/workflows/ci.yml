# Verification for the DEFAULT branch.
#
# This replaces the old "Scala CI - dev" workflow, which watched a `dev` branch
# that does not exist — so it had never run. `release.yml` watches `release`,
# which does not exist either. The result was that the only workflow ever to
# execute in this repo was release-binaries.yml, on a tag, and that one builds
# and smoke-tests binaries without running a single unit test. Every commit
# reached `viewer` unverified, and the first CI a change met was the one
# publishing it to the public.
#
# So this runs the two things a release actually depends on, in the order that
# fails fastest: the suite (~1673 tests, including the 810-case graphviz
# byte-exact corpus), then the optimized frontend build that
# release-binaries.yml will later redo on a tag.

name: CI

on:
  push:
    branches: [ "viewer" ]
  pull_request:
    branches: [ "viewer" ]
  # Lets a red default branch be re-checked without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Runs any JavaScript action that still targets Node 20 on Node 24 instead.
#
# After the v5 bump every actions/* here is natively Node 24, so this now covers
# only the third-party actions the repo does not control (sbt/setup-sbt,
# Swatinem/rust-cache, VirtusLab/scala-cli-setup, softprops/action-gh-release,
# scalacenter/sbt-dependency-submission).
#
# NOTE it does not silence the deprecation annotation — it CAUSES the "are being
# forced to run on Node.js 24" wording. The annotation names the offenders,
# which is how the v5 bump knew what to bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# A push that supersedes an in-flight run makes that run irrelevant; cancel it
# rather than pay for it. But never cancel on the default branch itself, where
# each commit's status is a fact worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/viewer' }}

jobs:
  verify:
    name: Tests + frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          # sbt-dynver derives the version from `git describe`; a shallow clone
          # without tags yields a garbage version. Same reason
          # scripts/build-viewer-netlify.sh unshallows.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '18'

      # JDK 17 everywhere: release-binaries.yml, the smoke workflow and the
      # Netlify script all pin 17, and CI that builds on a different JDK than
      # the artifacts we ship is not verifying what we ship.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      # REQUIRED. setup-java's `cache: 'sbt'` caches sbt's dependencies but does
      # not install sbt, and the Ubuntu runner images no longer ship it — the
      # first run of this workflow died with exit 127 on exactly that. The
      # inherited dev.yml had the same gap and nobody could know, because it
      # watched a branch that does not exist and had never run once.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # MUST precede `sbt testFull`: the viewer's Scala.js tests are bundled with
      # esbuild from node_modules before Playwright loads them, and no sbt task
      # installs node deps itself. (`npm run build` below needs them too.)
      - name: Install npm modules
        run: npm install

      # First, because it is the cheap signal. A graphviz corpus failure here
      # is a real regression, never a rebaseline: that module is a byte-exact
      # transcription of the dot engine.
      # testFull, not test: under sbt 2 `test` is the incremental task (what sbt
      # 1 called testQuick, now an alias for it) and only runs what failed
      # before or whose dependencies changed. A cold CI checkout makes the two
      # equivalent today, but a gate should not depend on the cache being empty.
      - name: Run tests
        run: sbt -J-Xmx2G testFull

      # Then the build the release depends on, reusing the compilation above.
      # fullLinkJS breakage is otherwise invisible until a tag is already
      # pushed and the release is already public.
      - name: Build frontend bundle (optimized)
        run: |
          sbt -J-Xmx2G "viewer/fullLinkJS"
          npm run build

  # The desktop/gx crates ship in every release, but nothing verified them on
  # this branch: local-capabilities-smoke.yml watches `dev`, `release` and
  # `codex/**` — none of which exist here — so its Rust job only ever ran by
  # manual dispatch, and release-binaries.yml first compiles them when a tag is
  # already pushed. Same disease this workflow was created to cure, one
  # directory over. macOS runner to match that workflow's Rust job: the desktop
  # crate links webkit2gtk on Linux and would need an apt step here.
  rust:
    name: Rust tests (desktop)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri

      # Covers the control server's URL decoding, including the Windows-shaped
      # paths that no macOS/Linux runtime smoke can reach.
      - name: Test desktop crate
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # The gx crate is gone: gx is Scala now (D2), and its tests run under
      # `sbt testFull` alongside the rest of the build.

  # Submits the sbt dependency graph to GitHub, which is what makes Dependabot
  # alerts work for Scala dependencies — without it, GitHub only sees this
  # repo's npm and cargo manifests and every JVM dependency is invisible to
  # security advisories.
  #
  # The idea was inherited: a commented-out sbt-dependency-submission step sat
  # in both dev.yml and release.yml, in neither case on a workflow that could
  # run. Revived here on the branch that actually executes, at the current major
  # (v3) rather than the 2022-era pinned SHA it was parked at.
  dependency-graph:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Push only. The submission API writes to the repo, which a fork's PR token
    # cannot do, and a graph submitted from an unmerged branch is noise anyway.
    if: github.event_name == 'push'
    # Overrides the workflow-level `contents: read`: submitting the graph is a
    # write to the repository's dependency data.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # The action loads the build to resolve dependencies, and this build
      # generates ScalablyTyped facades from node_modules.
      - name: Install npm modules
        run: npm install

      - uses: scalacenter/sbt-dependency-submission@v3
